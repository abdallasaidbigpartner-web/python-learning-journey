name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/run-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx scikit-learn numpy groq

      - name: Run test suite (excluding PyTorch tests, which run via dedicated CI)
        run: pytest -v --ignore=test_neural_network.py

name: Test PyTorch Neural Network

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run neural network lesson
        run: python lesson27_neural_network.py

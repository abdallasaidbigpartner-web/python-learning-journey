name: Test Neural Embeddings

on:
  push:
    branches: [main]
    paths:
      - 'lesson30_neural_embeddings.py'
      - '.github/workflows/embeddings-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lesson30_neural_embeddings.py'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers scikit-learn

      - name: Run neural embeddings lesson
        run: python lesson30_neural_embeddings.py
